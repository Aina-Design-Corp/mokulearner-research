# Public page for the research commons — site/ is served as-is (no build
# step; the page is hand-authored, dependency-free static HTML).
#
# The deploy job follows the kuleana-portal publication gate: it runs only
# when the repository variable PUBLISH_PAGES is "true" (Settings → Secrets
# and variables → Actions → Variables) AND GitHub Pages is configured with
# Source: GitHub Actions. Until both are set by a person, nothing publishes.
name: publish-pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/publish-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
